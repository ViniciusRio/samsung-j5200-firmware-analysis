<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J5200 — Protótipo de navegação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">PROTÓTIPO LOCAL · NÃO INSTALÁVEL</p><h1>Início simples</h1>
      <p>Use as setas e Enter para testar a navegação. Os cartões não abrem aplicativos da TV.</p></header>
    <nav id="tiles" aria-label="Opções de demonstração">
      <button data-title="TV ao vivo">TV ao vivo</button>
      <button data-title="HDMI 1">HDMI 1</button>
      <button data-title="HDMI 2">HDMI 2</button>
      <button data-title="Aplicativos">Aplicativos</button>
      <button data-title="Configurações">Configurações</button>
    </nav>
    <p id="status" role="status">Selecione uma opção para visualizar seu estado de demonstração.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
